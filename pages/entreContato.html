<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.1/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.1/dist/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="../css/contato.css">
    <title>SCAmbiental - Entre em contato</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <button class="navbar-toggler" data-toggle="collapse" data-target="#navbarSupportedContent">
            Menu
        </button>
        <div class="container">
            <a href="/index.html" class="navbar-brand">SCA Ambiental</a>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                    <li class="dropdown dropdown-divider"></li>
                    <li><a href="/pages/sobreNos.html" class="nav-link">Sobre Nós</a></li>
                    <li><a href="/pages/entreContato.html" class="nav-link">Entre em Contato</a></li>
                    <li id="authLink"><a href="/pages/login.html" class="nav-link">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container contact mb-5 mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="contact-info">
                    <img src="https://image.ibb.co/kUASdV/contact-image.png" alt="image" />
                    <h2 class="text-white">Entre em contato</h2>
                    <h4 class="text-white">Faça uma denuncia ou uma sugestão!</h4>
                </div>
            </div>
            <div class="col-md-9">
                <div class="contact-form">
                    <div class="form-group">
                        <label class="control-label col-sm-2 mb-2" for="fname">Primeiro Nome:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control mb-3" id="fname"
                                placeholder="Insira seu primeiro nome" name="fname">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2  mb-2" for="lname">Sobrenome:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control mb-3" id="lname" placeholder="Insira seu sobrenome"
                                name="lname">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2  mb-2" for="email">Email:</label>
                        <div class="col-sm-10">
                            <input type="email" class="form-control mb-3" id="email" placeholder="Insira seu e-mail"
                                name="email">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2  mb-2" for="comment">Comentários:</label>
                        <div class="col-sm-10">
                            <textarea class="form-control mb-3" rows="5" id="comment"
                                placeholder="Insira seu comentário"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-offset-2 col-sm-10">
                            <button type="submit" class="btn btn-block mt-3 py-3">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-white py-3" style="background-color: #81c784;">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <p>&copy; 2025 Todos os direitos reservados.</p>
                <p>Desenvolva um site que promova a sustentabilidade, com foco em práticas ecológicas,
                    reciclagem e a importância da preservação ambiental.</p>
            </div>
            <div style="width: 30%; height: 200px; margin-left: 20px;">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3578.059321002072!2d-48.856011324593!3d-26.259738066238068!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94deaf52c93f75d9%3A0x28ae523a1a3be265!2sUniSENAI%20Campus%20Joinville!5e0!3m2!1spt-BR!2sbr!4v1740006933222!5m2!1spt-BR!2sbr"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                    style="border:0; width: 100%; height: 100%;"></iframe>
            </div>
        </div>
    </footer>
    <script src="/js/loginCredential.js"></script>
    <script src="/js/contact.js"></script>
    <script src="/js/auth.js"></script>
</body>

</html>

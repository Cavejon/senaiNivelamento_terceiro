<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/homePage.css">
    <title>SCAmbiental - Login e Registro</title>
</head>

<body>
    <section class="vh-100" style="background-color: #99cc99;">
        <div class="container card-login py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col col-xl-10">
                    <div class="card" style="border-radius: 1rem;">
                        <div class="row g-0">
                            <div class="col-md-6 col-lg-5 d-none d-md-block">
                                <img src="/imgs/login.webp" alt="login form" class="img-fluid"
                                    style="border-radius: 1rem 0 0 1rem; height: 40rem;" />
                            </div>
                            <div class="col-md-6 col-lg-7 d-flex align-items-center">
                                <div class="card-body p-4 p-lg-5 text-black">

                                    <form>

                                        <div class="d-flex align-items-center mb-3 pb-1">
                                            <svg class="svg-shadow" width="50" height="50" viewBox="0 0 200 200"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <circle cx="100" cy="100" r="90" stroke="green" stroke-width="5"
                                                    fill="lightgreen" />
                                                <path d="M100 40 C120 60, 140 100, 100 160 C60 100, 80 60, 100 40 Z"
                                                    fill="green" />
                                                <line x1="100" y1="160" x2="100" y2="180" stroke="saddlebrown"
                                                    stroke-width="5" />
                                            </svg>
                                        </div>

                                        <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Realize seu login por aqui!</h5>

                                        <div data-mdb-input-init class="form-outline mb-4">
                                            <label class="form-label" for="form2Example17">E-mail</label>
                                            <input type="email" id="form2Example17"
                                                class="form-control form-control-lg" placeholder="Insira seu e-mail"/>
                                        </div>

                                        <div data-mdb-input-init class="form-outline mb-4">
                                            <label class="form-label" for="form2Example27">Senha</label>
                                            <input type="password" id="form2Example27"
                                                class="form-control form-control-lg" placeholder="Insira sua senha"/>
                                        </div>

                                        <div class="d-flex justify-content-center mb-4">
                                            <button data-mdb-button-init data-mdb-ripple-init
                                                class="btn btn-success btn-lg" type="button">Login</button>
                                        </div>

                                    </form>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
